<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧校园 · 告警与工单管理</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:linear-gradient(180deg,rgba(10,22,40,0.4) 0%,rgba(13,31,60,0.4) 50%,rgba(10,22,40,0.4) 100%),url('IMG_20260604_153929.png') center/cover no-repeat;background-color:#0A1628;color:#E8F0FF;width:100vw;height:100vh;overflow:hidden;user-select:none}
.header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(10,22,40,0.95);border-bottom:1px solid rgba(0,212,255,0.15);z-index:100;position:relative}
.header .title{font-size:20px;font-weight:700;letter-spacing:3px;background:linear-gradient(90deg,#00D4FF,#6C5CE7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .info{display:flex;gap:24px;align-items:center;font-size:12px;color:#8899BB}
.header .status-dot{width:8px;height:8px;border-radius:50%;background:#36B37E;display:inline-block;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.main-container{height:calc(100vh - 52px - 50px);display:flex;padding:8px 10px;gap:8px}
.left-panel,.right-panel{width:27%;display:flex;flex-direction:column;gap:5px}
.center-panel{flex:1;display:flex;flex-direction:column;gap:5px}
.panel{background:rgba(13,31,60,0.85);border:1px solid rgba(0,212,255,0.12);border-radius:6px;padding:5px 8px;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.35);flex:1;display:flex;flex-direction:column}
.panel::before{content:'';position:absolute;top:0;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,0.3),transparent)}
.panel-title{font-size:11px;font-weight:600;color:#00D4FF;margin-bottom:1px;padding-left:8px;border-left:3px solid #00D4FF;letter-spacing:1px;flex-shrink:0}
.panel .chart-container{flex:1;min-height:0}
.center-model{flex:1;background:rgba(10,22,40,0.6);border:1px solid rgba(0,212,255,0.15);border-radius:8px;position:relative;overflow:hidden}
.center-model canvas{width:100%;height:100%;display:block}
.center-label{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:#8899BB;background:rgba(10,22,40,0.8);padding:4px 14px;border-radius:12px;letter-spacing:1px;border:1px solid rgba(0,212,255,0.15)}
/* 滚动列表 */
.scroll-list{overflow:hidden;height:100%}
.scroll-list .list-inner{animation:scrollUp 18s linear infinite}
.scroll-list .list-inner:hover{animation-play-state:paused}
@keyframes scrollUp{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
.list-row{display:flex;align-items:center;padding:5px 6px;font-size:11px;border-bottom:1px solid rgba(0,212,255,0.06);gap:6px}
.list-row .rank{width:18px;height:18px;border-radius:4px;text-align:center;line-height:18px;font-weight:700;font-size:10px;flex-shrink:0}
.list-row .rank.top3{background:rgba(0,212,255,0.2);color:#00D4FF}
.list-row .rank.normal{background:rgba(136,153,187,0.2);color:#8899BB}
.list-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .priority{font-size:10px;flex-shrink:0;width:32px;text-align:center;font-weight:600}
.list-row .assignee{font-size:10px;color:#8899BB;flex-shrink:0;width:50px}
.list-row .progress{font-size:10px;color:#00D4FF;flex-shrink:0;width:35px;font-weight:600}
/* 底部导航 */
.bottom-nav{height:50px;display:flex;align-items:center;justify-content:center;gap:0;background:rgba(10,22,40,0.95);border-top:1px solid rgba(0,212,255,0.15);z-index:100;position:relative}
.nav-btn{flex:1;max-width:200px;height:100%;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:#8899BB;cursor:pointer;transition:all 0.3s;border:none;background:transparent;border-top:2px solid transparent;font-family:inherit;letter-spacing:1px;text-decoration:none}
.nav-btn:hover{color:#C0D0F0;background:rgba(0,212,255,0.03)}
.nav-btn.active{color:#00D4FF;border-top-color:#00D4FF;background:rgba(0,212,255,0.06)}
.nav-btn .nav-icon{font-size:16px}
</style>
</head>
<body>

<div class="header">
  <div class="title">🏫 智慧校园 · 建筑智能运维可视化平台</div>
  <div class="info">
    <span><span class="status-dot"></span>系统在线</span>
    <span>📅 2026-06-08 星期一</span>
    <span>⏰ <span id="liveTime">--:--:--</span></span>
    <span>🔄 每30s自动刷新</span>
  </div>
</div>

<div class="main-container">
  <!-- ===== 左侧面板 ===== -->
  <div class="left-panel">
    <!-- ① 告警等级统计 -->
    <div class="panel">
      <div class="panel-title">🔔 本月各等级告警数量统计</div>
      <div class="chart-container" id="chart-bar-level"></div>
    </div>
    <!-- ② 30天告警趋势 -->
    <div class="panel">
      <div class="panel-title">📉 近30天告警数量趋势</div>
      <div class="chart-container" id="chart-line-month"></div>
    </div>
    <!-- ③ 告警类型分布 -->
    <div class="panel">
      <div class="panel-title">📊 本月告警类型分布</div>
      <div class="chart-container" id="chart-pie-type"></div>
    </div>
    <!-- ④ 告警响应时效分析 ★新增 -->
    <div class="panel">
      <div class="panel-title">⏱ 本月告警响应时效分析 (min)</div>
      <div class="chart-container" id="chart-line-response-time"></div>
    </div>
  </div>

  <!-- ===== 中间模型 ===== -->
  <div class="center-panel">
    <div class="center-model" id="center-model">
      <canvas id="canvas-center"></canvas>
      <div class="center-label">🔥 3D告警热力地图 · 柱体高度=告警数量 · 颜色=最高告警等级</div>
    </div>
  </div>

  <!-- ===== 右侧面板 ===== -->
  <div class="right-panel">
    <!-- ⑤ 工单列表 -->
    <div class="panel">
      <div class="panel-title">📋 进行中工单列表 TOP8</div>
      <div class="scroll-list" id="scroll-workorder"></div>
    </div>
    <!-- ⑥ 工单完成率 -->
    <div class="panel">
      <div class="panel-title">✅ 工单24h完成率</div>
      <div class="chart-container" id="chart-gauge-done"></div>
    </div>
    <!-- ⑦ 响应时间 -->
    <div class="panel">
      <div class="panel-title">⏱ 各班组近7日平均响应时间 (min)</div>
      <div class="chart-container" id="chart-bar-response"></div>
    </div>
    <!-- ⑧ 工单类型分布饼图 ★新增 -->
    <div class="panel">
      <div class="panel-title">📋 本月工单类型分布</div>
      <div class="chart-container" id="chart-pie-workorder-type"></div>
    </div>
  </div>
</div>

<!-- ===== 底部导航栏 ===== -->
<div class="bottom-nav">
  <a class="nav-btn" href="overview.html"><span class="nav-icon">📊</span>总体态势</a>
  <a class="nav-btn" href="energy.html"><span class="nav-icon">⚡</span>能耗管理</a>
  <a class="nav-btn" href="device.html"><span class="nav-icon">⚙</span>设备管理</a>
  <a class="nav-btn active" href="alert.html"><span class="nav-icon">🔔</span>告警工单</a>
</div>

<script>
var TEXT_COLOR='#8899BB',TEXT_WHITE='#E8F0FF',C_MAIN='#00D4FF',C_OK='#36B37E',C_WARN='#F5A623',C_ERR='#E54545',C_PURPLE='#6C5CE7';
var axisLabel={color:TEXT_COLOR,fontSize:8},axisLine={lineStyle:{color:'rgba(0,212,255,0.1)'}},splitLine={lineStyle:{color:'rgba(0,212,255,0.06)'}},legendS={textStyle:{color:TEXT_COLOR,fontSize:8},itemWidth:8,itemHeight:8};
function initChart(id){var d=document.getElementById(id);return d?echarts.init(d):null}
function grid(t){return{top:t||28,left:8,right:12,bottom:4,containLabel:true}}

(function tick(){var n=new Date;document.getElementById('liveTime').textContent=n.toTimeString().slice(0,8);setTimeout(tick,1000)})();

function renderWorkOrderScroll(id,data){
  var c=document.getElementById(id),h='<div class="list-inner">';
  for(var d=0;d<2;d++)data.forEach(function(r,i){
    var pc=r.priority.includes('紧急')?'#E54545':r.priority.includes('重要')?'#F5A623':'#8899BB';
    h+='<div class="list-row"><span class="rank '+(i<3?'top3':'normal')+'">'+(r.rank||i+1)+'</span><span class="name" style="flex:2">'+(r.title||'')+'</span><span class="priority" style="color:'+pc+'">'+r.priority+'</span><span class="assignee">'+(r.assignee||'')+'</span><span class="progress">'+r.progress+'</span></div>';
  });
  h+='</div>';c.innerHTML=h;
}

// ============ ① 柱状图 — 告警等级统计 ============
(function(){
  var c=initChart('chart-bar-level');
  c&&c.setOption({tooltip:{trigger:'axis'},legend:{...legendS,top:0,data:['本月','上月'],itemWidth:8,itemHeight:5},grid:grid(28),
    xAxis:{type:'category',data:['🔴 紧急','🟡 重要','🔵 一般','🟢 提示'],axisLabel,axisLine},
    yAxis:{type:'value',name:'条',nameTextStyle:{color:TEXT_COLOR,fontSize:7},axisLabel,splitLine},
    series:[
      {name:'本月',type:'bar',data:[18,86,235,412],itemStyle:{color:function(p){return[C_ERR,C_WARN,C_MAIN,C_OK][p.dataIndex]}},barWidth:14,barGap:'30%'},
      {name:'上月',type:'bar',data:[22,95,248,398],itemStyle:{color:'rgba(136,153,187,0.3)'},barWidth:14}
    ]
  });
})();

// ============ ② 折线图 — 30天告警趋势 ============
(function(){
  var c=initChart('chart-line-month');
  c&&c.setOption({tooltip:{trigger:'axis'},legend:{...legendS,top:0,data:['紧急','重要','一般','提示'],itemWidth:8,itemHeight:5},grid:grid(28),
    xAxis:{type:'category',data:['5/6','5/9','5/12','5/15','5/18','5/21','5/24','5/27','5/30','6/2'],axisLabel,axisLine},
    yAxis:{type:'value',name:'条',nameTextStyle:{color:TEXT_COLOR,fontSize:7},axisLabel,splitLine},
    series:[
      {name:'紧急',type:'line',data:[2,1,3,2,0,1,2,1,1,0],smooth:true,lineStyle:{color:C_ERR,width:1.5},symbol:'circle',symbolSize:3,itemStyle:{color:C_ERR}},
      {name:'重要',type:'line',data:[5,4,6,3,4,5,3,2,4,3],smooth:true,lineStyle:{color:C_WARN,width:1.5},symbol:'circle',symbolSize:3,itemStyle:{color:C_WARN}},
      {name:'一般',type:'line',data:[10,8,12,9,7,11,8,6,9,7],smooth:true,lineStyle:{color:C_MAIN,width:1.5},symbol:'circle',symbolSize:3,itemStyle:{color:C_MAIN}},
      {name:'提示',type:'line',data:[14,16,13,15,12,14,11,13,10,12],smooth:true,lineStyle:{color:C_OK,width:1.5},symbol:'circle',symbolSize:3,itemStyle:{color:C_OK}}
    ]
  });
})();

// ============ ③ 饼图 — 告警类型 ============
(function(){
  var c=initChart('chart-pie-type');
  c&&c.setOption({tooltip:{trigger:'item',formatter:'{b}: {c}%'},legend:{bottom:0,textStyle:{color:TEXT_COLOR,fontSize:8},itemWidth:8,itemHeight:8},
    series:[{type:'pie',radius:['40%','68%'],center:['50%','43%'],itemStyle:{borderRadius:4,borderColor:'rgba(10,22,40,0.8)',borderWidth:3},
      label:{color:TEXT_COLOR,fontSize:8,formatter:'{b}\n{d}%'},
      data:[{value:38.5,name:'设备故障告警',itemStyle:{color:C_ERR}},{value:25.2,name:'能耗异常告警',itemStyle:{color:C_WARN}},{value:21.8,name:'环境超标告警',itemStyle:{color:C_MAIN}},{value:14.5,name:'安防告警',itemStyle:{color:C_PURPLE}}]
    }]
  });
})();

// ============ ④ 折线图 — 告警响应时效分析 ★新增 ============
(function(){
  var c=initChart('chart-line-response-time');
  c&&c.setOption({tooltip:{trigger:'axis'},legend:{...legendS,top:0,data:['平均响应','平均修复','SLA目标'],itemWidth:8,itemHeight:5},grid:grid(28),
    xAxis:{type:'category',data:['5/29','5/30','5/31','6/1','6/2','6/3','6/4'],axisLabel,axisLine},
    yAxis:{type:'value',name:'min',nameTextStyle:{color:TEXT_COLOR,fontSize:7},axisLabel,splitLine},
    series:[
      {name:'平均响应',type:'line',data:[18.5,22.0,15.8,19.2,14.5,20.1,16.3],smooth:true,symbol:'circle',symbolSize:4,lineStyle:{color:C_MAIN,width:2},itemStyle:{color:C_MAIN},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(0,212,255,0.15)'},{offset:1,color:'rgba(0,212,255,0.01)'}]}}},
      {name:'平均修复',type:'line',data:[45.2,52.0,38.5,42.8,35.0,48.3,40.6],smooth:true,symbol:'circle',symbolSize:4,lineStyle:{color:C_WARN,width:2},itemStyle:{color:C_WARN},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(245,166,35,0.12)'},{offset:1,color:'rgba(245,166,35,0.01)'}]}}},
      {name:'SLA目标',type:'line',data:[30,30,30,30,30,30,30],lineStyle:{color:'rgba(54,179,126,0.5)',width:1,type:'dashed'},symbol:'none'}
    ]
  });
})();

// ============ ⑤ 滚动列表 — 工单 ============
renderWorkOrderScroll('scroll-workorder',[
  {rank:1,title:'3#变压器绕组温度超限检修',assignee:'电气班组',priority:'紧急',progress:'60%'},
  {rank:2,title:'行政楼AHU-B1-02回风异常',assignee:'暖通班组',priority:'重要',progress:'45%'},
  {rank:3,title:'冷冻站冷水机组冷凝器清洗',assignee:'暖通班组',priority:'重要',progress:'30%'},
  {rank:4,title:'水泵房P-03给水泵振动检修',assignee:'给排水班组',priority:'重要',progress:'10%'},
  {rank:5,title:'宿舍8栋ELV-09电梯层门调整',assignee:'电梯维保',priority:'一般',progress:'25%'},
  {rank:6,title:'教学楼C区3F照明通信恢复',assignee:'弱电班组',priority:'一般',progress:'80%'},
  {rank:7,title:'学生宿舍8栋用水异常排查',assignee:'给排水班组',priority:'一般',progress:'55%'},
  {rank:8,title:'第三食堂排烟风机异响检查',assignee:'暖通班组',priority:'一般',progress:'15%'}
]);

// ============ ⑥ 仪表盘 — 工单完成率 ============
(function(){
  var c=initChart('chart-gauge-done');
  c&&c.setOption({series:[{type:'gauge',center:['50%','55%'],radius:'78%',startAngle:210,endAngle:-30,min:0,max:100,
    axisLine:{lineStyle:{width:14,color:[[0.7,C_ERR],[0.85,C_WARN],[1,C_OK]]}},
    pointer:{length:'58%',width:4,itemStyle:{color:C_MAIN}},
    axisTick:{distance:-14,length:4,lineStyle:{width:1,color:'#999'}},
    splitLine:{distance:-17,length:10,lineStyle:{width:2,color:'#999'}},
    axisLabel:{distance:18,color:TEXT_COLOR,fontSize:8},
    detail:{formatter:'{value}%',color:TEXT_WHITE,fontSize:24,offsetCenter:[0,'60%']},
    data:[{value:82.5,name:'24h完成率'}]
  }],
  graphic:[{type:'text',left:'center',bottom:6,style:{text:'目标: 85% | 已完成33/40单',textAlign:'center',fill:TEXT_COLOR,fontSize:9}}]
  });
})();

// ============ ⑦ 横向柱状图 — 响应时间 ============
(function(){
  var c=initChart('chart-bar-response');
  var vals=[12.5,18.3,22.0,15.8,28.6,20.1];
  c&&c.setOption({tooltip:{trigger:'axis'},legend:{...legendS,top:0,data:['平均响应','目标值'],itemWidth:8,itemHeight:5},grid:grid(28),
    xAxis:{type:'value',name:'min',nameTextStyle:{color:TEXT_COLOR,fontSize:7},axisLabel,splitLine,max:35},
    yAxis:{type:'category',data:['电气班组','暖通班组','给排水班组','弱电班组','电梯维保','综合维修'].reverse(),axisLabel:{...axisLabel,fontSize:9},axisLine},
    series:[
      {name:'平均响应',type:'bar',data:vals.reverse(),itemStyle:{color:function(p){var v=vals.reverse();return v[p.dataIndex]<=15?C_OK:v[p.dataIndex]<=20?C_WARN:C_ERR}},barWidth:11},
      {name:'目标值',type:'bar',data:[15,15,15,15,30,20].reverse(),itemStyle:{color:'rgba(0,212,255,0.15)',borderColor:'rgba(0,212,255,0.4)',borderWidth:1,borderType:'dashed',borderRadius:2},barWidth:11,barGap:'-130%'}
    ]
  });
})();

// ============ ⑧ 饼图 — 工单类型分布 ★新增 ============
(function(){
  var c=initChart('chart-pie-workorder-type');
  c&&c.setOption({tooltip:{trigger:'item',formatter:'{b}: {c}单'},legend:{bottom:0,textStyle:{color:TEXT_COLOR,fontSize:7},itemWidth:7,itemHeight:7},
    series:[{type:'pie',radius:['35%','62%'],center:['50%','40%'],itemStyle:{borderRadius:3,borderColor:'rgba(10,22,40,0.8)',borderWidth:2},
      label:{color:TEXT_COLOR,fontSize:7,formatter:'{b}\n{d}%'},
      data:[
        {value:28,name:'电气检修',itemStyle:{color:C_MAIN}},
        {value:22,name:'暖通维修',itemStyle:{color:C_PURPLE}},
        {value:18,name:'给排水维修',itemStyle:{color:C_OK}},
        {value:15,name:'电梯维保',itemStyle:{color:C_WARN}},
        {value:10,name:'弱电/智能化',itemStyle:{color:'#00B4D8'}},
        {value:7,name:'综合土建',itemStyle:{color:'#8899BB'}}
      ]
    }],
    graphic:[{type:'text',left:'center',top:'37%',style:{text:'40',textAlign:'center',fill:TEXT_WHITE,fontSize:18,fontWeight:'bold'}},{type:'text',left:'center',top:'50%',style:{text:'进行中工单',textAlign:'center',fill:TEXT_COLOR,fontSize:8}}]
  });
})();

// ============ 中心 Canvas — 告警热力地图 ============
(function(){
  var cnv=document.getElementById('canvas-center'),ctx,rafId;
  function h2r(h,a){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return'rgba('+r+','+g+','+b+','+a+')'}
  function draw(){
    cnv.width=cnv.parentElement.clientWidth;cnv.height=cnv.parentElement.clientHeight;
    ctx=cnv.getContext('2d');var W=cnv.width,H=cnv.height;
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(0,212,255,0.04)';ctx.lineWidth=0.5;
    for(var i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}
    for(var i=0;i<H;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke()}
    var alarms=[{name:'3#变压器',x:W*0.55,y:H*0.65,count:8,level:'紧急',color:'#E54545'},{name:'行政楼AHU',x:W*0.78,y:H*0.35,count:5,level:'重要',color:'#F5A623'},{name:'冷冻站',x:W*0.30,y:H*0.55,count:6,level:'重要',color:'#F5A623'},{name:'水泵房',x:W*0.22,y:H*0.70,count:4,level:'重要',color:'#F5A623'},{name:'教学楼C区',x:W*0.32,y:H*0.30,count:3,level:'一般',color:'#00D4FF'},{name:'宿舍8栋',x:W*0.72,y:H*0.68,count:3,level:'一般',color:'#00D4FF'},{name:'食堂排烟',x:W*0.52,y:H*0.72,count:2,level:'一般',color:'#00D4FF'},{name:'体育馆',x:W*0.16,y:H*0.42,count:1,level:'提示',color:'#36B37E'}];
    var now=Date.now()/1000;
    alarms.forEach(function(a,i){
      var pH=18+a.count*16,bW=14,tW=10,bx=a.x-bW/2,by=a.y,ty=by-pH;
      var glow=ctx.createRadialGradient(a.x,ty,0,a.x,ty,pH*0.5);
      glow.addColorStop(0,h2r(a.color,0.25));glow.addColorStop(1,'transparent');
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(a.x,ty,pH*0.5,0,Math.PI*2);ctx.fill();
      var pulse=Math.sin(now*2+i)*0.5+0.5,ringR=bW/2+4+pulse*8;
      ctx.strokeStyle=h2r(a.color,0.25+pulse*0.35);ctx.lineWidth=1.5-pulse*0.5;
      ctx.beginPath();ctx.arc(a.x,a.y,ringR,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=a.color;ctx.globalAlpha=0.8;
      ctx.beginPath();ctx.moveTo(a.x-tW/2,ty);ctx.lineTo(a.x+tW/2,ty);ctx.lineTo(a.x+bW/2,by);ctx.lineTo(a.x-bW/2,by);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
      var topGlow=ctx.createRadialGradient(a.x,ty,0,a.x,ty,tW);
      topGlow.addColorStop(0,'#FFFFFF');topGlow.addColorStop(0.4,a.color);topGlow.addColorStop(1,'transparent');
      ctx.fillStyle=topGlow;ctx.beginPath();ctx.arc(a.x,ty,tW,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#E8F0FF';ctx.font='bold 9px "Microsoft YaHei"';ctx.textAlign='center';ctx.fillText(a.name,a.x,by+15);
      ctx.fillStyle=a.color;ctx.font='8px "Microsoft YaHei"';ctx.fillText(a.level+' · '+a.count+'条',a.x,by+26);
    });
    rafId=requestAnimationFrame(draw);
  }
  draw();
})();

window.addEventListener('resize',function(){
  var cnv=document.getElementById('canvas-center');
  if(cnv){cnv.width=cnv.parentElement.clientWidth;cnv.height=cnv.parentElement.clientHeight}
});
</script>
