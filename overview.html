<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧校园 · 总体态势</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:linear-gradient(180deg,rgba(10,22,40,0.4) 0%,rgba(13,31,60,0.4) 50%,rgba(10,22,40,0.4) 100%),url('IMG_20260604_153929.png') center/cover no-repeat;background-color:#0A1628;color:#E8F0FF;width:100vw;height:100vh;overflow:hidden;user-select:none}
.header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(10,22,40,0.95);border-bottom:1px solid rgba(0,212,255,0.15);z-index:100;position:relative}
.header .title{font-size:20px;font-weight:700;letter-spacing:3px;background:linear-gradient(90deg,#00D4FF,#6C5CE7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .info{display:flex;gap:24px;align-items:center;font-size:12px;color:#8899BB}
.header .status-dot{width:8px;height:8px;border-radius:50%;background:#36B37E;display:inline-block;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.main-container{height:calc(100vh - 52px - 50px);display:flex;padding:8px 10px;gap:8px}
.left-panel,.right-panel{width:27%;display:flex;flex-direction:column;gap:6px}
.center-panel{flex:1;display:flex;flex-direction:column;gap:6px}
.panel{background:rgba(13,31,60,0.85);border:1px solid rgba(0,212,255,0.12);border-radius:6px;padding:6px 8px;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.35);flex:1;display:flex;flex-direction:column}
.panel::before{content:'';position:absolute;top:0;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,0.3),transparent)}
.panel-title{font-size:12px;font-weight:600;color:#00D4FF;margin-bottom:2px;padding-left:8px;border-left:3px solid #00D4FF;letter-spacing:1px;flex-shrink:0}
.panel .chart-container{flex:1;min-height:0}
.panel.half{flex:0.48}
.center-model{flex:1;background:rgba(10,22,40,0.6);border:1px solid rgba(0,212,255,0.15);border-radius:8px;position:relative;overflow:hidden}
.center-model canvas{width:100%;height:100%;display:block}
.center-label{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:#8899BB;background:rgba(10,22,40,0.8);padding:4px 14px;border-radius:12px;letter-spacing:1px;border:1px solid rgba(0,212,255,0.15)}
/* 翻牌器 */
.flip-card{display:flex;align-items:center;justify-content:center;gap:16px;height:100%}
.flip-main{text-align:center}
.flip-value{font-size:48px;font-weight:700;font-family:'DIN','Roboto Mono',monospace;color:#E54545;line-height:1.1}
.flip-value.ok{color:#36B37E}
.flip-unit{font-size:14px;color:#8899BB;margin-left:4px}
.flip-trend{font-size:13px;margin-top:2px}
.flip-trend.down{color:#36B37E}
.flip-trend.up{color:#E54545}
.flip-detail{display:flex;flex-direction:column;gap:4px;font-size:11px;color:#8899BB}
.flip-detail span{display:flex;justify-content:space-between;gap:12px}
.flip-detail .lvl{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}
/* 滚动列表 */
.scroll-list{overflow:hidden;height:100%}
.scroll-list .list-inner{animation:scrollUp 18s linear infinite}
.scroll-list .list-inner:hover{animation-play-state:paused}
@keyframes scrollUp{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
.list-row{display:flex;align-items:center;padding:5px 6px;font-size:11px;border-bottom:1px solid rgba(0,212,255,0.06);gap:6px}
.list-row .rank{width:18px;height:18px;border-radius:4px;text-align:center;line-height:18px;font-weight:700;font-size:10px;flex-shrink:0}
.list-row .rank.top3{background:rgba(0,212,255,0.2);color:#00D4FF}
.list-row .rank.normal{background:rgba(136,153,187,0.2);color:#8899BB}
.list-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .value{font-weight:700;color:#E8F0FF;flex-shrink:0}
.list-row .trend{font-size:10px;flex-shrink:0;width:20px;text-align:center}
.list-row .trend.up{color:#E54545}.list-row .trend.down{color:#36B37E}.list-row .trend.flat{color:#8899BB}
/* 底部导航 */
.bottom-nav{height:50px;display:flex;align-items:center;justify-content:center;gap:0;background:rgba(10,22,40,0.95);border-top:1px solid rgba(0,212,255,0.15);z-index:100;position:relative}
.nav-btn{flex:1;max-width:200px;height:100%;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:#8899BB;cursor:pointer;transition:all 0.3s;border:none;background:transparent;border-top:2px solid transparent;font-family:inherit;letter-spacing:1px;text-decoration:none}
.nav-btn:hover{color:#C0D0F0;background:rgba(0,212,255,0.03)}
.nav-btn.active{color:#00D4FF;border-top-color:#00D4FF;background:rgba(0,212,255,0.06)}
.nav-btn .nav-icon{font-size:16px}
</style>
</head>
<body>

<div class="header">
  <div class="title">🏫 智慧校园 · 建筑智能运维可视化平台</div>
  <div class="info">
    <span><span class="status-dot"></span>系统在线</span>
    <span>📅 2026-06-08 星期一</span>
    <span>⏰ <span id="liveTime">--:--:--</span></span>
    <span>🔄 每30s自动刷新</span>
  </div>
</div>

<div class="main-container">
  <!-- ===== 左侧面板 ===== -->
  <div class="left-panel">
    <!-- ① 健康度仪表盘 -->
    <div class="panel">
      <div class="panel-title">📊 校园综合运行健康度</div>
      <div class="chart-container" id="chart-gauge-health"></div>
    </div>
    <!-- ② 能耗占比饼图 -->
    <div class="panel">
      <div class="panel-title">🍩 各建筑当日能耗占比</div>
      <div class="chart-container" id="chart-pie-energy"></div>
    </div>
    <!-- ③ 7天综合运维指数 -->
    <div class="panel">
      <div class="panel-title">📈 近7日综合运维指数趋势</div>
      <div class="chart-container" id="chart-line-ops"></div>
    </div>
    <!-- ④ 今日告警总数（翻牌器）★新增 -->
    <div class="panel">
      <div class="panel-title">🔔 今日告警总数（同比昨日）</div>
      <div class="flip-card" id="flip-alarm"></div>
    </div>
  </div>

  <!-- ===== 中间模型 ===== -->
  <div class="center-panel">
    <div class="center-model" id="center-model">
      <canvas id="canvas-center"></canvas>
      <div class="center-label">🗺 校园2.5D鸟瞰模型 · 建筑健康度实时映射</div>
    </div>
  </div>

  <!-- ===== 右侧面板 ===== -->
  <div class="right-panel">
    <!-- ⑤ 服务人次滚动列表 -->
    <div class="panel">
      <div class="panel-title">👥 各区域实时服务人次 TOP8</div>
      <div class="scroll-list" id="scroll-service"></div>
    </div>
    <!-- ⑥ 设备完好率环形图 -->
    <div class="panel">
      <div class="panel-title">🔧 设备综合完好率</div>
      <div class="chart-container" id="chart-ring-device"></div>
    </div>
    <!-- ⑦ 在校人数仪表盘 -->
    <div class="panel half">
      <div class="panel-title">🎓 当前在校人数</div>
      <div class="chart-container" id="chart-gauge-people"></div>
    </div>
    <!-- ⑧ 建筑健康度排行 ★新增 -->
    <div class="panel">
      <div class="panel-title">🏗 各建筑健康度排行（分）</div>
      <div class="chart-container" id="chart-bar-health-rank"></div>
    </div>
  </div>
</div>

<!-- ===== 底部导航栏 ===== -->
<div class="bottom-nav">
  <a class="nav-btn active" href="overview.html"><span class="nav-icon">📊</span>总体态势</a>
  <a class="nav-btn" href="energy.html"><span class="nav-icon">⚡</span>能耗管理</a>
  <a class="nav-btn" href="device.html"><span class="nav-icon">⚙</span>设备管理</a>
  <a class="nav-btn" href="alert.html"><span class="nav-icon">🔔</span>告警工单</a>
</div>

<script>
// ============ 通用 ============
const DARK_BG='transparent',TEXT_COLOR='#8899BB',TEXT_WHITE='#E8F0FF';
const C_MAIN='#00D4FF',C_OK='#36B37E',C_WARN='#F5A623',C_ERR='#E54545',C_PURPLE='#6C5CE7';
const axisLabel={color:TEXT_COLOR,fontSize:9};
const axisLine={lineStyle:{color:'rgba(0,212,255,0.1)'}};
const splitLine={lineStyle:{color:'rgba(0,212,255,0.06)'}};
const legendS={textStyle:{color:TEXT_COLOR,fontSize:9},itemWidth:8,itemHeight:8};
function initChart(id){const d=document.getElementById(id);return d?echarts.init(d):null}
function grid(t){return{top:t||28,left:8,right:12,bottom:4,containLabel:true}}

// 实时时钟
(function tick(){var n=new Date;document.getElementById('liveTime').textContent=n.toTimeString().slice(0,8);setTimeout(tick,1000)})();

// 滚动列表
function renderScroll(id,data){
  var c=document.getElementById(id),h='<div class="list-inner">';
  for(var d=0;d<2;d++)data.forEach(function(r,i){
    h+='<div class="list-row"><span class="rank '+(i<3?'top3':'normal')+'">'+(r.rank||i+1)+'</span><span class="name">'+(r.name||'')+'</span><span class="value">'+(r.value||'')+'</span>';
    if(r.trend!==undefined)h+='<span class="trend '+(r.trend==='↑'?'up':r.trend==='↓'?'down':'flat')+'">'+r.trend+'</span>';
    h+='</div>';
  });
  h+='</div>';c.innerHTML=h;
}

// ============ ① 仪表盘 — 健康度 ============
(function(){
  var c=initChart('chart-gauge-health');
  c&&c.setOption({series:[{type:'gauge',center:['50%','55%'],radius:'78%',startAngle:210,endAngle:-30,min:0,max:100,
    axisLine:{lineStyle:{width:16,color:[[0.6,C_ERR],[0.85,C_WARN],[1,C_OK]]}},
    pointer:{length:'62%',width:5,itemStyle:{color:C_MAIN}},
    axisTick:{distance:-16,length:5,lineStyle:{width:1,color:'#999'}},
    splitLine:{distance:-20,length:12,lineStyle:{width:2,color:'#999'}},
    axisLabel:{distance:22,color:TEXT_COLOR,fontSize:9},
    detail:{valueAnimation:true,formatter:'{value}%',color:TEXT_WHITE,fontSize:26,fontWeight:'bold',offsetCenter:[0,'60%']},
    data:[{value:86.5,name:'健康度'}]
  }]});
})();

// ============ ② 饼图 — 能耗占比 ============
(function(){
  var c=initChart('chart-pie-energy');
  c&&c.setOption({tooltip:{trigger:'item',formatter:'{b}: {c}%'},
    legend:{bottom:0,textStyle:{color:TEXT_COLOR,fontSize:8},itemWidth:8,itemHeight:8},
    series:[{type:'pie',radius:['42%','70%'],center:['50%','43%'],itemStyle:{borderRadius:4,borderColor:'rgba(10,22,40,0.8)',borderWidth:3},
      label:{color:TEXT_COLOR,fontSize:9,formatter:'{b}\n{d}%'},
      data:[{value:34.2,name:'教学楼群',itemStyle:{color:'#00D4FF'}},{value:22.8,name:'图书馆',itemStyle:{color:'#6C5CE7'}},{value:18.5,name:'学生宿舍',itemStyle:{color:'#36B37E'}},{value:12.5,name:'食堂',itemStyle:{color:'#F5A623'}},{value:7.0,name:'行政楼',itemStyle:{color:'#E54545'}},{value:5.0,name:'体育馆/校医院',itemStyle:{color:'#00B4D8'}}]
    }]
  });
})();

// ============ ③ 折线图 — 近7日综合运维指数 ============
(function(){
  var c=initChart('chart-line-ops');
  c&&c.setOption({tooltip:{trigger:'axis'},
    legend:{...legendS,top:0,data:['运维指数','安全指数','能效指数']},
    grid:grid(30),
    xAxis:{type:'category',data:['6/2','6/3','6/4','6/5','6/6','6/7','6/8'],axisLabel,axisLine},
    yAxis:{type:'value',name:'分',nameTextStyle:{color:TEXT_COLOR,fontSize:8},axisLabel,splitLine},
    series:[
      {name:'运维指数',type:'line',data:[84.2,85.1,86.5,85.8,87.2,86.9,87.8],smooth:true,symbol:'circle',symbolSize:5,lineStyle:{color:C_MAIN,width:2.5},itemStyle:{color:C_MAIN},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(0,212,255,0.2)'},{offset:1,color:'rgba(0,212,255,0.01)'}]}}},
      {name:'安全指数',type:'line',data:[91.5,92.0,91.8,92.5,93.1,92.8,93.5],smooth:true,symbol:'circle',symbolSize:3,lineStyle:{color:C_OK,width:1.5},itemStyle:{color:C_OK}},
      {name:'能效指数',type:'line',data:[78.0,79.5,78.8,80.2,81.0,80.5,82.1],smooth:true,symbol:'circle',symbolSize:3,lineStyle:{color:C_WARN,width:1.5},itemStyle:{color:C_WARN}}
    ]
  });
})();

// ============ ④ 翻牌器 — 今日告警总数 ★新增 ============
(function(){
  var alarmData={today:18,yesterday:22,trend:-18.2,detail:[{level:'紧急',count:2,color:'#E54545'},{level:'重要',count:5,color:'#F5A623'},{level:'一般',count:8,color:'#00D4FF'},{level:'提示',count:3,color:'#36B37E'}]};
  var c=document.getElementById('flip-alarm');
  c.innerHTML='<div class="flip-main"><div style="font-size:12px;color:#8899BB;margin-bottom:4px">今日累计</div><div><span class="flip-value">'+alarmData.today+'</span><span class="flip-unit">条</span></div><div class="flip-trend down">↓ '+Math.abs(alarmData.trend)+'% vs 昨日('+alarmData.yesterday+'条)</div></div><div class="flip-detail">'+alarmData.detail.map(function(d){return '<span><b style="color:'+d.color+'">'+d.level+'</b> '+d.count+' 条</span>'}).join('')+'</div>';
})();

// ============ ⑤ 滚动列表 — 服务人次 ============
renderScroll('scroll-service',[
  {rank:1,name:'第一食堂',value:'3,520 人次',trend:'↑'},{rank:2,name:'图书馆主馆',value:'2,890 人次',trend:'↑'},
  {rank:3,name:'教学楼A区',value:'2,450 人次',trend:'→'},{rank:4,name:'第二食堂',value:'2,180 人次',trend:'↓'},
  {rank:5,name:'宿舍楼1-5栋',value:'1,960 人次',trend:'→'},{rank:6,name:'教学楼B区',value:'1,720 人次',trend:'↑'},
  {rank:7,name:'体育馆',value:'1,350 人次',trend:'↓'},{rank:8,name:'行政楼',value:'890 人次',trend:'→'}
]);

// ============ ⑥ 环形图 — 设备完好率 ============
(function(){
  var c=initChart('chart-ring-device');
  c&&c.setOption({series:[{type:'pie',radius:['58%','78%'],center:['50%','50%'],itemStyle:{borderRadius:4,borderColor:'rgba(10,22,40,0.8)',borderWidth:2},label:{show:false},emphasis:{label:{show:true,fontSize:13,fontWeight:'bold'}},
    data:[{value:94.8,name:'正常运行',itemStyle:{color:C_OK}},{value:3.2,name:'计划检修',itemStyle:{color:C_WARN}},{value:2.0,name:'故障停机',itemStyle:{color:C_ERR}}]}],
    graphic:[{type:'text',left:'center',top:'42%',style:{text:'94.8%',textAlign:'center',fill:TEXT_WHITE,fontSize:20,fontWeight:'bold'}},{type:'text',left:'center',top:'55%',style:{text:'完好率',textAlign:'center',fill:TEXT_COLOR,fontSize:9}}],
    legend:{bottom:0,textStyle:{color:TEXT_COLOR,fontSize:8},itemWidth:8,itemHeight:8}
  });
})();

// ============ ⑦ 仪表盘 — 在校人数 ============
(function(){
  var c=initChart('chart-gauge-people');
  c&&c.setOption({series:[{type:'gauge',center:['50%','55%'],radius:'78%',startAngle:210,endAngle:-30,min:0,max:25000,
    axisLine:{lineStyle:{width:14,color:[[0.4,C_OK],[0.7,C_WARN],[1,C_ERR]]}},
    pointer:{length:'58%',width:5,itemStyle:{color:C_PURPLE}},
    axisTick:{distance:-14,length:4,lineStyle:{width:1,color:'#999'}},
    splitLine:{distance:-17,length:10,lineStyle:{width:2,color:'#999'}},
    axisLabel:{distance:18,color:TEXT_COLOR,fontSize:8},
    detail:{formatter:'{value}人',color:TEXT_WHITE,fontSize:20,offsetCenter:[0,'60%']},
    data:[{value:15230,name:'在校人数'}]
  }]});
})();

// ============ ⑧ 横向柱状图 — 建筑健康度排行 ★新增 ============
(function(){
  var c=initChart('chart-bar-health-rank');
  c&&c.setOption({tooltip:{trigger:'axis'},
    grid:{top:8,left:60,right:20,bottom:4,containLabel:true},
    xAxis:{type:'value',max:100,name:'分',nameTextStyle:{color:TEXT_COLOR,fontSize:8},axisLabel,splitLine},
    yAxis:{type:'category',data:['图书馆','校医院','体育馆','教学楼A','行政楼','宿舍1-5栋','教学楼B','教学楼C','宿舍6-10栋','食堂'].reverse(),axisLabel:{...axisLabel,fontSize:9},axisLine},
    series:[{type:'bar',data:[95,94,93,92,91,88,88,87,85,85].reverse(),barWidth:13,
      itemStyle:{color:function(p){var v=[95,94,93,92,91,88,88,87,85,85].reverse();return v[p.dataIndex]>=90?C_OK:v[p.dataIndex]>=85?C_WARN:C_ERR}},
      label:{show:true,position:'right',color:TEXT_WHITE,fontSize:10,fontWeight:'bold',formatter:'{c}分'}
    }]
  });
})();

// ============ 中心 Canvas — 校园鸟瞰模型 ============
(function(){
  var cnv=document.getElementById('canvas-center'),ctx;
  var buildings=[{name:'教学楼A',cx:0.22,cy:0.35,w:0.14,h:0.16,color:'#00D4FF',health:92},{name:'教学楼B',cx:0.38,cy:0.28,w:0.12,h:0.14,color:'#00B4D8',health:88},{name:'教学楼C',cx:0.30,cy:0.55,w:0.12,h:0.13,color:'#00D4FF',health:90},{name:'图书馆',cx:0.60,cy:0.42,w:0.16,h:0.20,color:'#6C5CE7',health:95},{name:'行政楼',cx:0.78,cy:0.35,w:0.12,h:0.15,color:'#36B37E',health:91},{name:'食堂',cx:0.50,cy:0.70,w:0.14,h:0.12,color:'#F5A623',health:85},{name:'宿舍区',cx:0.75,cy:0.65,w:0.18,h:0.18,color:'#00D4FF',health:88},{name:'体育馆',cx:0.15,cy:0.72,w:0.10,h:0.12,color:'#36B37E',health:93},{name:'校医院',cx:0.88,cy:0.55,w:0.08,h:0.10,color:'#36B37E',health:94}];
  function h2r(h,a){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return'rgba('+r+','+g+','+b+','+a+')'}
  function drawB3D(x,y,w,h,color,alpha){
    var d=h*0.25;ctx.fillStyle=h2r(color,alpha);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w*0.12,y-d);ctx.lineTo(x+w*1.12,y-d);ctx.lineTo(x+w,y);ctx.closePath();ctx.fill();
    ctx.fillStyle=h2r(color,alpha*0.6);ctx.fillRect(x,y,w,h);
    ctx.fillStyle=h2r(color,alpha*0.3);ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w*1.12,y-d);ctx.lineTo(x+w*1.12,y-d+h);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();
    ctx.strokeStyle=h2r(color,alpha*0.8);ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);
  }
  function draw(){
    cnv.width=cnv.parentElement.clientWidth;cnv.height=cnv.parentElement.clientHeight;
    ctx=cnv.getContext('2d');var W=cnv.width,H=cnv.height;
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(0,212,255,0.05)';ctx.lineWidth=0.5;
    for(var i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}
    for(var i=0;i<H;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke()}
    ctx.strokeStyle='rgba(0,212,255,0.1)';ctx.lineWidth=10;
    ctx.beginPath();ctx.moveTo(0,H*0.48);ctx.lineTo(W,H*0.48);ctx.stroke();
    ctx.beginPath();ctx.moveTo(W*0.45,0);ctx.lineTo(W*0.45,H);ctx.stroke();
    buildings.forEach(function(b){
      var bx=b.cx*W-b.w*W/2,by=b.cy*H-b.h*H/2,bw=b.w*W,bh=b.h*H;
      var color=b.health<70?'#E54545':b.health<85?'#F5A623':b.color;
      drawB3D(ctx,bx,by,bw,bh,color,b.health>=85?0.9:0.7);
      ctx.fillStyle='#E8F0FF';ctx.font='bold 10px "Microsoft YaHei"';ctx.textAlign='center';ctx.fillText(b.name,bx+bw/2,by+bh+14);
      ctx.fillStyle=b.health>=85?'#36B37E':b.health>=70?'#F5A623':'#E54545';ctx.font='bold 9px "Microsoft YaHei"';ctx.fillText(b.health+'分',bx+bw/2,by+bh/2+4);
    });
  }
  draw();window.addEventListener('resize',draw);
})();
</script>
